# JellyStudy CI：编译 + 单元测试 + 前端 build
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven install (all modules)
        working-directory: jellystudy-parent
        run: mvn -B clean install -DskipTests

      - name: Coach unit tests
        working-directory: jellystudy-parent
        run: mvn -B test -pl jellystudy-coach-service -am "-Dtest=KnowledgeMasteryBuilderTest,AuthTokenStoreTest"

      - name: QA unit tests
        working-directory: jellystudy-parent
        run: mvn -B test -pl jellystudy-qa -am "-Dtest=QuestionRankScoringTest"

      - name: Common unit tests
        working-directory: jellystudy-parent
        run: mvn -B test -pl jellystudy-common -am "-Dtest=JellystudyBearerWriteAuthFilterTest,ApiKeyAuthFilterTest"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Gateway
        working-directory: jellystudy-parent
        run: mvn -B package -pl jellystudy-gateway -am -DskipTests
