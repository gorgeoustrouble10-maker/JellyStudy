server:
  port: ${SERVER_PORT:8083}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import:
      - optional:classpath:application-jellystudy.yml
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: jellystudy-evaluate-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:jellystudy_redis}
      timeout: 3000ms
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/jellystudy_evaluate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

dubbo:
  application:
    name: jellystudy-evaluate-provider
    qos-enable: false
    register-mode: instance
  protocol:
    name: tri
    port: ${DUBBO_PROTOCOL_PORT:50053}
    serialization: fastjson2
  registry:
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
    register-mode: instance
    check: false
    timeout: 30000
  config-center:
    check: false
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
  metadata-report:
    check: false
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
  scan:
    base-packages: com.jellystudy.evaluate.service
  provider:
    register: true
  consumer:
    check: false
    timeout: 60000
    init-check: false

logging:
  level:
    com.jellystudy: INFO
    org.apache.dubbo: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 默认尝试千问；无有效 DASHSCOPE_API_KEY 时自动回退 Mock（见 ModelEngineSelectorConfiguration）
evaluate:
  model:
    type: ${EVALUATE_MODEL_TYPE:qianwen}
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: qwen-turbo
    timeout: 60000
    retry-count: 3

jellystudy:
  redis:
    question-eval-prefix: "jelly:eval:question:"
    answer-eval-prefix: "jelly:eval:answer:"
    eval-cache-ttl-minutes: 10
  instance:
    id: ${INSTANCE_ID:evaluate-1}

coach:
  rabbit:
    evaluation-queue: jelly.coach.evaluation.completed
