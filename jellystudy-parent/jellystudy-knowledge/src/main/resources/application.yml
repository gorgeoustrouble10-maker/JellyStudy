server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: jellystudy-knowledge
  config:
    import:
      - optional:classpath:application-jellystudy.yml
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/jellystudy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:jellystudy_redis}

dubbo:
  application:
    name: jellystudy-knowledge-provider
    qos-enable: false
    register-mode: instance
  protocol:
    name: tri
    port: ${DUBBO_PROTOCOL_PORT:50051}
    serialization: fastjson2
  registry:
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
    register-mode: instance
    check: false
    timeout: 30000
  config-center:
    check: false
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
  metadata-report:
    check: false
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
  scan:
    base-packages: com.jellystudy.knowledge.service
  provider:
    register: true
  consumer:
    check: false
    timeout: 60000

knowledge:
  list:
    max-list-size: 0

logging:
  level:
    com.jellystudy: INFO
    org.apache.dubbo: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
