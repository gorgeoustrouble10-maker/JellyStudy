server:
  port: ${SERVER_PORT:8084}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: jellystudy-coach-service
  config:
    import:
      - optional:classpath:application-jellystudy.yml
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:127.0.0.1}:${MONGO_PORT:27017}/jellystudy_coach
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:jellystudy_redis}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

dubbo:
  application:
    name: jellystudy-coach-provider
    qos-enable: false
    register-mode: instance
  protocol:
    name: tri
    port: ${DUBBO_PROTOCOL_PORT:50054}
    serialization: fastjson2
  registry:
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
    register-mode: instance
    check: false
    timeout: 30000
  config-center:
    check: false
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
  metadata-report:
    check: false
    address: nacos://${NACOS_HOST:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
  scan:
    base-packages: com.jellystudy.coach.service
  provider:
    register: true
  consumer:
    check: false
    timeout: 120000

coach:
  model:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: qwen-turbo
    timeout: 60000
  growth:
    daily-goal-count: 3
    points-per-task: 10
    points-high-score: 5
    streak-bonus: 50
  rabbit:
    evaluation-queue: jelly.coach.evaluation.completed
    quiz-queue: jelly.coach.quiz.generate
  redis:
    today-tasks-prefix: "jelly:coach:tasks:"
    streak-prefix: "jelly:coach:streak:"
    leaderboard-key: "jelly:coach:leaderboard"

logging:
  level:
    com.jellystudy: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
