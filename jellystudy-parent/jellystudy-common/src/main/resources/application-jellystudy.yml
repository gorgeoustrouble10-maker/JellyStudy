# 各服务通过 spring.config.import 引入的共享安全配置
jellystudy:
  security:
    enabled: ${JELLYSTUDY_SECURITY_ENABLED:false}
    api-key: ${JELLYSTUDY_API_KEY:}
  auth:
    bearer-write-enabled: ${JELLYSTUDY_BEARER_WRITE_ENABLED:true}
  cors:
    allowed-origins: ${JELLYSTUDY_CORS_ORIGINS:http://127.0.0.1:9945,http://localhost:9945}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
